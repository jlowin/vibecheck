name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Test
        run: uv run --frozen pytest

      - name: Build
        run: uv build

      - name: Check the built version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! ls dist/vibecheck_py-"$tag"-*.whl >/dev/null 2>&1; then
            echo "Built $(ls dist/*.whl) doesn't match release tag $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vibecheck-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
